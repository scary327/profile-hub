[package]
name = "profile-hub"
version = "0.1.0"
description = "Profile Hub - isolated work profiles and game mode for Windows"
authors = ["you"]
edition = "2021"

[lib]
name = "profile_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
log = "0.4"
# Геймпады: Xbox/XInput через gilrs, DualSense/DualShock 4 — напрямую по HID
# (WebView2 и Windows.Gaming.Input читают DualSense по Bluetooth некорректно)
gilrs = "0.11"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_System_Registry",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
